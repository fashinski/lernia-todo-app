<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My ToDo - Lernia</title>

  <!-- Keep the CSS in a separate file. -->
  <link rel="stylesheet" href="style.css?v=a2-video">
</head>
<body>
  <!-- The white panel enters from above when the page opens. -->
  <main>
    <h1>My ToDo</h1>

    <!-- Update this label when a task is completed, undone or deleted. -->
    <p id="completed-label" aria-live="polite">0 completed</p>

    <!-- Keep an accessible label without adding text to the video layout. -->
    <label for="todo-input" class="visually-hidden">New task</label>
    <div class="input-row">
      <input id="todo-input" type="text" autocomplete="off" aria-describedby="info">
      <button id="add-button" type="button">OK</button>
    </div>

    <!-- An empty submission shows the blinking red message here. -->
    <p id="info" role="alert"></p>

    <!-- JavaScript adds each task as an li inside this list. -->
    <ul id="todo-list"></ul>
  </main>

  <!-- Load JavaScript after the HTML elements. -->
  <script src="script.js?v=a2-video"></script>
</body>
</html>
